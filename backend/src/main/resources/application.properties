# ==========================================
# Application & Server Setup
# ==========================================

spring.config.import=optional:file:.env[.properties]
spring.application.name=AI-Powered-Customer-Support-Triage-Auto-Resolution-Agent
server.port=${SERVER_PORT:8081}


# ==========================================
# Database Configuration (PostgreSQL)
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bugcraft_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / Hibernate Configuration
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ==========================================
# Security & JWT Configuration
# ==========================================

# server.address=0.0.0.0
# server.port=8081

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ==========================================
# Groq / OpenAI LLM Configuration
# ==========================================

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile